name: Build Desk APK

on:
  push:
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run optional server/Android tests and lint
        type: boolean
        default: false
      build_release:
        description: Require private signing (fails if signing secrets are missing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    if: github.event_name == 'workflow_dispatch' && inputs.run_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: python -m pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Restore persistent private signing identity when configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.DESK_KEYSTORE_BASE64 }}
          DESK_STORE_PASSWORD: ${{ secrets.DESK_STORE_PASSWORD }}
          DESK_KEY_ALIAS: ${{ secrets.DESK_KEY_ALIAS }}
          DESK_KEY_PASSWORD: ${{ secrets.DESK_KEY_PASSWORD }}
          REQUIRE_SIGNING: ${{ inputs.build_release }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$REQUIRE_SIGNING" = 'true' ]; then
              echo 'Run scripts/setup_signing.py then scripts/configure_updates.py on your PC first.'
              exit 1
            fi
            echo 'Signing not configured: development artifact only. In-app updates need private signing secrets.'
            exit 0
          fi
          test -n "$DESK_STORE_PASSWORD" && test -n "$DESK_KEY_ALIAS" && test -n "$DESK_KEY_PASSWORD" || { echo 'Private signing secrets are incomplete.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/desk-release.keystore"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Build development APK
        working-directory: android
        env:
          DESK_STORE_FILE: ${{ runner.temp }}/desk-release.keystore
          DESK_STORE_PASSWORD: ${{ secrets.DESK_STORE_PASSWORD }}
          DESK_KEY_ALIAS: ${{ secrets.DESK_KEY_ALIAS }}
          DESK_KEY_PASSWORD: ${{ secrets.DESK_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug :app:minifyReleaseWithR8
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          DESK_STORE_FILE: ${{ runner.temp }}/desk-release.keystore
          DESK_STORE_PASSWORD: ${{ secrets.DESK_STORE_PASSWORD }}
          DESK_KEY_ALIAS: ${{ secrets.DESK_KEY_ALIAS }}
          DESK_KEY_PASSWORD: ${{ secrets.DESK_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Optional Android tests and lint
        if: github.event_name == 'workflow_dispatch' && inputs.run_checks
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Desk-Dev-2.3.0-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Desk-Release-2.3.0-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish signed in-app update channels
        if: steps.signing.outputs.ready == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/folder-ai-and-reliability')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_updates.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_checks
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
      - name: Remove restored key
        if: always()
        run: rm -f "$RUNNER_TEMP/desk-release.keystore"
