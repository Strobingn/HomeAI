name: Build Desk APK

on:
  push:
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run optional server/Android tests and lint
        type: boolean
        default: false
      build_release:
        description: Build private-key release (requires signing secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    if: github.event_name == 'workflow_dispatch' && inputs.run_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: python -m pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build development APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Optional Android tests and lint
        if: github.event_name == 'workflow_dispatch' && inputs.run_checks
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Desk-Dev-2.1.0-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_checks
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore private release key
        env:
          KEYSTORE_BASE64: ${{ secrets.DESK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the private DESK signing secrets first. See README.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/desk-release.keystore"
      - name: Build signed release
        working-directory: android
        env:
          DESK_STORE_FILE: ${{ runner.temp }}/desk-release.keystore
          DESK_STORE_PASSWORD: ${{ secrets.DESK_STORE_PASSWORD }}
          DESK_KEY_ALIAS: ${{ secrets.DESK_KEY_ALIAS }}
          DESK_KEY_PASSWORD: ${{ secrets.DESK_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Desk-Release-2.1.0
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Remove restored key
        if: always()
        run: rm -f "$RUNNER_TEMP/desk-release.keystore"
